services:
  # Database service - runs first, no dependencies
  db:
    image: mysql:8.0
    container_name: ${CONTAINER_DB}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USER}",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Database admin interface - depends on db
  adminer:
    image: adminer:latest
    container_name: ${CONTAINER_ADMINER}
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Shared package - builds TypeScript library in watch mode
  shared:
    build:
      context: .
      dockerfile: ./packages/shared/Dockerfile
    container_name: ${CONTAINER_SHARED:-matcha-shared}
    volumes:
      # Mount source code for hot reload
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
      # Persist compiled output
      - shared_dist:/app/packages/shared/dist
      # Avoid overwriting node_modules
      - shared_node_modules:/app/node_modules

  # Backend API server - depends on db and shared
  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: ${CONTAINER_SERVER}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - NODE_ENV=development
      - SERVER_PORT=${SERVER_PORT}
      - WEB_URL=${WEB_URL}
      - SERVER_URL=${SERVER_URL}
      - DB_HOST=${CONTAINER_DB}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_CONNECTION_LIMIT=${DB_POOL_CONNECTION_LIMIT:-10}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
    volumes:
      # Mount source code for hot reload
      - ./apps/server/src:/app/apps/server/src:ro
      - ./apps/server/tsconfig.json:/app/apps/server/tsconfig.json:ro
      # Mount shared package source for changes
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
      # Use shared compiled output from shared service
      - shared_dist:/app/packages/shared/dist:ro
      # Persist uploads directory (CRITICAL - user data)
      - server_uploads:/app/apps/server/uploads
      # Avoid overwriting node_modules
      - server_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      shared:
        condition: service_started

  # Frontend web application - depends on server
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: ${CONTAINER_WEB}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      - NODE_ENV=development
      - VITE_WEB_PORT=${WEB_PORT}
      - VITE_WEB_URL=${WEB_URL}
      - VITE_SERVER_URL=${SERVER_URL}
    volumes:
      # Mount source code for hot reload
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      - ./apps/web/public:/app/apps/web/public:ro
      # Mount shared package source for changes
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
      # Use shared compiled output from shared service
      - shared_dist:/app/packages/shared/dist:ro
      # Avoid overwriting node_modules
      - web_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
      shared:
        condition: service_started

volumes:
  # Database data - persist across rebuilds
  mysql_data:
    name: matcha_mysql_data

  # Shared package compiled output - shared between services
  shared_dist:
    name: matcha_shared_dist

  # Node modules volumes - improve performance, can be deleted for clean rebuild
  shared_node_modules:
    name: matcha_shared_node_modules
  server_node_modules:
    name: matcha_server_node_modules
  web_node_modules:
    name: matcha_web_node_modules

  # User uploads - persist across rebuilds
  server_uploads:
    name: matcha_server_uploads
